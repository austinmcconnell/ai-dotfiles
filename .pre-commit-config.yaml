---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-json
        types: [file]
        files: \.(json)$
      - id: check-merge-conflict
      - id: check-yaml
        args:
          - --allow-multiple-documents
      - id: debug-statements
      - id: double-quote-string-fixer
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: sort-claude-settings-json
        name: Sort claude-code settings.json top-level keys
        language: script
        entry: scripts/sort-claude-settings-json.sh
        files: ^etc/claude-code/settings\.json$
        pass_filenames: false
      - id: validate-claude-path-rules
        name: Validate Claude Code path rules are absolute
        language: script
        entry: scripts/validate-claude-path-rules.sh
        files: ^etc/claude-code/settings\.json$|^scripts/validate-claude-path-rules\.sh$
        pass_filenames: false
      - id: validate-agent-denies
        name: Validate agent deny lists
        language: script
        entry: scripts/validate-agent-denies.sh
        files: ^etc/kiro-cli/cli-agents/.*\.json$
        pass_filenames: false
      - id: validate-memory-types
        name: Validate memory-type vocabulary and handoff convention
        language: script
        entry: scripts/validate-memory-types.sh
        files: ^etc/ai/steering/shared/cross-session-memory\.md$|^etc/ai/skills/shared/handoff-management/SKILL\.md$|^scripts/validate-memory-types\.sh$
        pass_filenames: false
      - id: validate-persona-steering
        name: Validate persona steering
        language: script
        entry: scripts/validate-persona-steering.sh
        files: ^etc/ai/steering/.*\.md$|^etc/claude-code/agents/.*\.md$|^install/persona-domains\.sh$|^scripts/generate-personas\.sh$
        pass_filenames: false
      - id: validate-kiro-steering-globs
        name: Validate kiro steering per-domain glob contract
        language: script
        entry: scripts/validate-kiro-steering-globs.sh
        files: ^etc/ai/steering/.*\.md$|^etc/kiro-cli/cli-agents/.*\.json$|^install/ai-tools\.sh$|^scripts/validate-kiro-steering-globs\.sh$
        pass_filenames: false
      - id: validate-steering-seams
        name: Validate steering seam links (scratch HOME)
        language: script
        entry: scripts/validate-steering-seams.sh
        files: ^install/ai-tools\.sh$|^scripts/validate-steering-seams\.sh$
        pass_filenames: false
      - id: validate-mcp-server-parity
        name: Validate MCP server parity
        language: script
        entry: scripts/validate-mcp-server-parity.sh
        files: ^etc/kiro-cli/settings/mcp\.json$|^etc/kiro-cli/cli-agents/jira\.json$|^install/claude-code\.sh$
        pass_filenames: false
      - id: validate-hook-wiring
        name: Validate hook wiring parity
        language: script
        entry: scripts/validate-hook-wiring.sh
        files: ^etc/ai/hooks/.*\.sh$|^etc/kiro-cli/hooks/.*\.sh$|^etc/kiro-cli/cli-agents/.*\.json$|^etc/claude-code/settings\.json$|^etc/claude-code/agents/.*\.md$
        pass_filenames: false
      - id: validate-steering-references
        name: Validate steering and skill references
        language: script
        entry: scripts/validate-steering-references.sh
        files: ^etc/ai/steering/.*\.md$|^etc/ai/skills/.*/SKILL\.md$|^scripts/validate-steering-references\.sh$
        pass_filenames: false
      - id: hook-behavior-tests
        name: Blocking hook behavior tests
        language: script
        entry: etc/ai/hooks/test/test-hooks.sh
        files: ^etc/ai/hooks/.*\.sh$
        pass_filenames: false
      - id: usage-subagent-cost-tests
        name: Subagent cost pricing tests
        language: script
        entry: etc/ai/usage/test/test-subagent-cost.sh
        files: ^etc/ai/usage/(lib\.sh|pricing\.json|claude-subagent-statusline\.sh|backfill-subagent-cost\.sh|repair-subagent-tasks\.sh|test/test-subagent-cost\.sh)$
        pass_filenames: false
      - id: usage-estimate-session-cost-tests
        name: Session cost estimator tests
        language: script
        entry: etc/ai/usage/test/test-estimate-session-cost.sh
        files: ^etc/ai/usage/(lib\.sh|pricing\.json|schema\.sql|migrations/.*\.sql|estimate-session-cost\.sh|test/test-estimate-session-cost\.sh)$
        pass_filenames: false
      - id: usage-ai-usage-tests
        name: ai-usage report tests
        language: script
        entry: etc/ai/usage/test/test-ai-usage.sh
        files: ^(bin/ai-usage|etc/ai/usage/(lib\.sh|schema\.sql|migrations/.*\.sql|test/test-ai-usage\.sh))$
        pass_filenames: false
      - id: usage-compaction-hook-tests
        name: Compaction hook logging tests
        language: script
        entry: etc/ai/usage/test/test-compaction-hook.sh
        files: ^etc/ai/(hooks/log-compaction-event\.sh|usage/(lib\.sh|schema\.sql|migrations/.*\.sql|test/test-compaction-hook\.sh))$
        pass_filenames: false
      - id: usage-resolve-compaction-tests
        name: Compaction boundary resolver tests
        language: script
        entry: etc/ai/usage/test/test-resolve-compaction.sh
        files: ^etc/ai/usage/(lib\.sh|schema\.sql|migrations/.*\.sql|resolve-compaction-boundaries\.sh|test/test-resolve-compaction\.sh)$
        pass_filenames: false
      - id: usage-statusline-tests
        name: Statusline rendering tests
        language: script
        entry: etc/ai/usage/test/test-statusline.sh
        files: ^etc/ai/usage/(lib\.sh|claude-statusline\.sh|resolve-compaction-boundaries\.sh|test/test-statusline\.sh)$
        pass_filenames: false
      - id: usage-migration-tests
        name: usage.db migration tests
        language: script
        entry: etc/ai/usage/test/test-migrations.sh
        files: ^etc/ai/usage/(lib\.sh|schema\.sql|migrations/.*\.sql|test/test-migrations\.sh)$
        pass_filenames: false
      - id: shfmt
        name: shfmt
        minimum_pre_commit_version: 2.4.0
        language: golang
        additional_dependencies: [mvdan.cc/sh/v3/cmd/shfmt@v3.10.0]
        entry: shfmt
        args: ["-w", "-i", "4"]
        types: [shell]
        exclude_types: ["zsh"]
      - id: shellcheck
        name: ShellCheck
        description: Static analysis tool for shell scripts (installed via CLI)
        language: system
        entry: shellcheck
        types: [shell]
        exclude_types: ["zsh"]
      - id: dprint
        name: dprint
        language: system
        entry: dprint fmt
        args: ["--config", "etc/dprint/dprint.jsonc", "--allow-no-files"]
        files: \.(json|sublime-settings|yaml|yml)$
  - repo: https://github.com/openstack/bashate
    rev: 2.1.1
    hooks:
      - id: bashate
        args: ["--max-line-length", "100", "--ignore", "E004,E006,E040,E044"]
        exclude_types: ["zsh"]
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        exclude: "etc/ai/prompts/"
        additional_dependencies:
          - mdformat-gfm
          - mdformat-gfm-alerts
          - mdformat-frontmatter
          - mdformat-simple-breaks
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.0
    hooks:
      - id: rumdl-fmt
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-c", "etc/yaml/yamllint"]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--skip", "*.json,*.yaml"]
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        args: ["--config", "etc/taplo/taplo.toml"]
      - id: taplo-lint
        args: ["--config", "etc/taplo/taplo.toml"]
